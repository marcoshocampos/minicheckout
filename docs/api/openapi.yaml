openapi: 3.1.0

# =============================================================================
# Esta spec é a FONTE DA VERDADE do contrato, escrita à mão.
#
# Regra do projeto: ela descreve o contrato COMO ELE É HOJE, não como vai
# ficar. Cada fase do roteiro atualiza esta spec junto com o código, no mesmo
# commit. Onde o contrato ainda vai mudar, está marcado com "FASE N".
#
# Por que à mão e não gerada: o que realmente precisa de documentação aqui não
# é inferível do código — que o Idempotency-Key é obrigatório, o que 409
# significa, por que o mesmo payload devolve a resposta salva, e que o webhook
# pode chegar duplicado. Escrever isso à mão obriga a decidir a semântica.
# =============================================================================

info:
  title: Mini Checkout API
  version: 0.4.0
  summary: Criação de pedidos com cobrança, notificação assíncrona e webhook.
  description: |
    API de um projeto de **estudo**. O domínio é propositalmente minúsculo: a
    complexidade está nas fronteiras (HTTP de entrada, banco, HTTP de saída,
    fila, webhook), que é onde observabilidade, rastreabilidade, tratamento de
    erros e idempotência importam.

    ### Estado atual: Fase 2 concluída

    | Fase | Assunto | Estado |
    |---|---|---|
    | 0 | Setup, domínio mínimo, gateway fake | concluída |
    | 1 | Logs estruturados e correlação | concluída |
    | 2 | Tratamento de erros, Problem Details, retry | concluída |
    | 3 | Idempotência (requisição, webhook e job) | pendente |
    | 4 | Tracing distribuído | pendente |
    | 5 | Métricas e alertas | pendente |

    O que isso significa para quem lê: **todo erro é Problem Details** (RFC
    9457, com `Content-Type: application/problem+json`), mas o
    `Idempotency-Key` **ainda não deduplica nada** — hoje ele é só
    obrigatório. A Fase 3 resolve, e é por isso que o `504` abaixo pede para
    você *consultar* o pedido em vez de repetir a cobrança.

    ### Os tipos de problema

    O campo `type` é a chave estável para o cliente tratar erro
    programaticamente. Esta API usa:

    | `type` | status | significa |
    |---|---|---|
    | `/problems/missing-idempotency-key` | 400 | falta o header obrigatório |
    | `/problems/validation` | 422 | payload inválido (campos em `errors`) |
    | `/problems/payment-declined` | 402 | o gateway disse "não" |
    | `/problems/gateway-unavailable` | 503 | não cobramos; pode repetir |
    | `/problems/payment-unconfirmed` | 504 | **não sabemos** se cobramos |
    | `/problems/internal` | 5xx | erro nosso, inesperado |
    | `about:blank` | 404, 405, 415, 429 | o status já diz tudo |

    A diferença entre `503` e `504` é a mais importante da API: no `503` a
    cobrança **não aconteceu** e repetir é seguro; no `504` ela pode ter
    acontecido, e repetir pode cobrar duas vezes.

    ### Correlação

    Toda resposta traz o header **`X-Request-Id`**, inclusive em erro. Guarde
    esse valor: é com ele que se acha, de uma vez, o log da borda (nginx), o
    da aplicação, o do gateway de pagamento e o do job assíncrono que a
    requisição disparou. Se você mandar o header na requisição, ele é
    respeitado.
  contact:
    name: Repositório
    url: https://github.com/marcoshocampos/minicheckout
  license:
    name: Projeto de estudo, sem licença definida

servers:
  - url: http://localhost:8010
    description: Docker Compose local (porta do serviço nginx)

tags:
  - name: Pedidos
    description: O fluxo único do projeto.
  - name: Webhooks
    description: Endpoint que o gateway de pagamento chama de volta.

paths:
  /orders:
    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Cria um pedido e tenta a cobrança
      description: |
        Cria o pedido com status `pending`, chama o gateway de pagamento de
        forma **síncrona** e devolve o pedido com o resultado já aplicado.

        Se a cobrança for aprovada, um job de notificação é despachado na fila
        (Redis) e processado por outro container. O `notified_at` da resposta
        por isso vem **quase sempre `null`**: o job ainda não rodou quando a
        resposta é montada. Consulte `GET /orders/{id}` depois para vê-lo
        preenchido.

        #### Sobre o Idempotency-Key

        O header é **obrigatório** — sem ele, `400`. Mas hoje ele não faz mais
        nada: mandar a mesma chave duas vezes cria **dois** pedidos e gera
        **duas** cobranças. Isso é intencional e é o ponto de partida da Fase 3.

        #### Quanto tempo esta chamada pode levar

        A cobrança é síncrona e **pode ser retentada** por nós antes de a
        resposta sair. O orçamento é `3 tentativas x 3s de timeout + backoff`,
        ou seja **até ~10s** no pior caso.

        Nós só retentamos quando há prova de que a cobrança não foi
        processada: erro de conexão, ou um `408`/`429`/`503` do gateway. Um
        `500` do gateway, ou um timeout de leitura, **não** são retentados —
        podem já ter cobrado.

        #### O que fazer com cada erro

        | status | repetir a requisição? |
        |---|---|
        | `400`, `422` | só depois de corrigir o payload |
        | `402` | não: a resposta não vai mudar; troque o meio de pagamento |
        | `503` | **sim**, respeitando o `Retry-After`. Nada foi cobrado |
        | `504` | **não**. Consulte `GET /orders/{id}` (veja `instance`) |
        | `500` | não automaticamente; informe o `request_id` |

        #### O que ainda falta no contrato

        - `409` e `422` por chave repetida, e replay da resposta salva: Fase 3
        - quando a Fase 3 existir, o `504` passa a poder ser repetido com a
          **mesma** `Idempotency-Key` com segurança
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              aprovado:
                summary: Pedido comum
                value:
                  amount_cents: 1990
                  currency: BRL
                  customer_email: eu@example.test
      responses:
        '201':
          description: |
            Pedido criado **e pago**.

            Mudou na Fase 2: antes isto também era a resposta de uma cobrança
            recusada (com `status: declined` no corpo), o que fazia um cliente
            que olha só o código HTTP achar que tinha vendido. Recusa agora é
            `402`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                pago:
                  summary: Cobrança aprovada
                  value:
                    id: 01a1ef36-69f0-7128-819b-2f9d7a625b18
                    status: paid
                    amount_cents: 1990
                    currency: BRL
                    customer_email: eu@example.test
                    payment_id: pay_ede9d00436c4ea2c
                    decline_reason: null
                    paid_at: '2026-11-18T15:11:24.000000Z'
                    notified_at: null
                    created_at: '2026-11-18T15:11:23.000000Z'
        '400':
          $ref: '#/components/responses/IdempotencyKeyAusente'
        '402':
          $ref: '#/components/responses/PagamentoRecusado'
        '422':
          $ref: '#/components/responses/ErroDeValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/GatewayIndisponivel'
        '504':
          $ref: '#/components/responses/PagamentoSemConfirmacao'

  /orders/{id}:
    get:
      tags: [Pedidos]
      operationId: showOrder
      summary: Consulta um pedido
      description: |
        Útil para ver o `notified_at` depois de o job da fila rodar, e para
        acompanhar a mudança de status quando o webhook do gateway chega.

        **É também a resposta ao `504`**: quando o `POST /orders` devolve
        `/problems/payment-unconfirmed`, o `instance` do problema aponta para
        cá. Consultar é o que você faz em vez de repetir a cobrança — pelo
        menos até a Fase 3 tornar a repetição segura.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do pedido.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: O pedido.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /webhooks/payments:
    post:
      tags: [Webhooks]
      operationId: receivePaymentWebhook
      summary: Recebe a confirmação de pagamento do gateway
      description: |
        Chamado **pelo gateway**, não pelo cliente. O gateway envia em processo
        separado, com atraso configurável, e pode enviar a mesma entrega mais
        de uma vez.

        #### O que hoje não é tratado, de propósito

        - **Entrega duplicada.** O gateway reenvia com o **mesmo `event_id`**.
          Hoje cada entrega é processada de novo, do começo. A Fase 3 resolve
          com `UNIQUE(event_id)` no banco — não com um `if (já existe)`, que
          duas entregas simultâneas furam.
        - **Fora de ordem.** Um `payment.failed` que chegue depois de um
          `payment.succeeded` hoje sobrescreve o status. A transição precisa
          ser monotônica e comparar `occurred_at`, não a hora de chegada.
        - **Autenticidade.** Não há assinatura HMAC. O gateway é nosso, mas um
          endpoint público sem assinatura é porta aberta.

        Quando o pedido não existe, responde `202` e **descarta** o evento —
        uma decisão que a Fase 3 deve revisar: devolver erro faria o gateway
        reentregar, o que é a favor de quem processa, desde que o
        processamento seja idempotente.
      parameters:
        - name: X-Gateway-Event-Id
          in: header
          description: Mesmo valor de `event_id` do corpo, para facilitar o log.
          schema:
            type: string
        - name: X-Gateway-Delivery
          in: header
          description: |
            Contador da entrega, no formato `n/total`. É assim que você **vê**
            a duplicata no log em vez de adivinhar.
          schema:
            type: string
            examples: ['2/3']
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentEvent'
      responses:
        '200':
          description: Evento processado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestIdResponse'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
        '202':
          description: Pedido não encontrado; o evento foi descartado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestIdResponse'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ignored
        '422':
          $ref: '#/components/responses/ErroDeValidacao'

  /up:
    get:
      tags: [Pedidos]
      operationId: healthCheck
      summary: Health check
      description: |
        Rota nativa do Laravel. É o que o healthcheck do container `nginx` no
        Docker Compose consulta: passar aqui significa nginx, php-fpm, Laravel
        e banco inteiros de pé.
      responses:
        '200':
          description: Aplicação saudável.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestIdResponse'
          content:
            text/html:
              schema:
                type: string

components:
  headers:
    XRequestIdResponse:
      description: |
        O id de correlação desta requisição, devolvido pelo middleware
        `App\Http\Middleware\RequestId`.

        Vem em **toda** resposta, inclusive em 4xx e 5xx — é justamente no erro
        que o cliente precisa dele: é o que ele tem para abrir um chamado
        ("deu erro, o id é X") e alguém conseguir achar a requisição inteira no
        log, incluindo o job assíncrono que ela disparou.

        É o mesmo valor que você enviou, se enviou um válido; senão, um id novo
        (ULID, ordenável por tempo).
      required: true
      schema:
        type: string
        examples: ['01KA7Z4R8P3Q1T6V9W2X5Y8Z0B']

    RetryAfter:
      description: |
        Quantos segundos esperar antes de repetir a requisição.

        Vem **só** no `503` (`/problems/gateway-unavailable`), porque só ali
        nós sabemos que a cobrança não aconteceu. O `504` não traz este header
        de propósito: ele é um convite a repetir, e repetir é o que pode
        cobrar duas vezes enquanto a Fase 3 não existir.

        O valor é fixo hoje, o que sincroniza todos os clientes no mesmo
        segundo. Um valor com jitter espalharia a volta — é a mesma discussão
        do backoff do nosso retry, vista do outro lado do fio.
      required: false
      schema:
        type: integer
        examples: [5]

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave escolhida pelo cliente para identificar **a intenção** da
        requisição. Serve para você poder repetir a chamada com segurança
        depois de um timeout, sem risco de cobrar duas vezes.

        Hoje é só obrigatório: nada é deduplicado (Fase 3).
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: ['pedido-do-cliente-42-tentativa-1']

    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Id de correlação. Se você mandar, ele é respeitado e aparece no log de
        acesso do nginx, nos logs da aplicação, no gateway e no job da fila. Se
        não mandar, um é gerado.

        É o que permite dizer "deu erro, o id é X" e alguém achar a requisição
        inteira — inclusive o que aconteceu de forma assíncrona depois dela.

        **O valor volta sempre no response**: veja o header `X-Request-Id` em
        cada resposta desta spec.

        O id recebido é **validado** antes de ser usado, porque ele vai parar
        num índice de log — um valor com quebra de linha dentro injetaria uma
        linha de log falsa. Um valor que não passa na validação é descartado e
        substituído por um gerado: ou seja, o que você mandou pode não ser o
        que volta. O `maxLength` abaixo é o limite que o middleware aplica.
      schema:
        type: string
        maxLength: 200

  schemas:
    CreateOrderRequest:
      type: object
      required: [amount_cents, currency, customer_email]
      properties:
        amount_cents:
          type: integer
          minimum: 1
          maximum: 100000000
          description: |
            Valor em centavos. Inteiro, nunca float: dinheiro em ponto
            flutuante é bug esperando acontecer.
          examples: [1990]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          enum: [BRL, USD]
          examples: [BRL]
        customer_email:
          type: string
          format: email
          examples: [eu@example.test]
      additionalProperties: false

    Order:
      type: object
      required: [id, status, amount_cents, currency, customer_email, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID gerado pela aplicação.
        status:
          $ref: '#/components/schemas/OrderStatus'
        amount_cents:
          type: integer
        currency:
          type: string
        customer_email:
          type: string
          format: email
        payment_id:
          type: [string, 'null']
          description: Id da cobrança no gateway. Nulo até o pagamento ser tentado.
        decline_reason:
          type: [string, 'null']
          description: Só preenchido quando `status` é `declined`.
          examples: [insufficient_funds]
        paid_at:
          type: [string, 'null']
          format: date-time
        notified_at:
          type: [string, 'null']
          format: date-time
          description: |
            Preenchido pelo job da fila, em outro processo. Quase sempre `null`
            na resposta do `POST /orders`.
        created_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum: [pending, paid, declined, failed, unknown]
      description: |
        `declined`, `failed` e `unknown` são três coisas diferentes, e a
        distinção é o assunto da Fase 2:

        | Status | O que aconteceu | Repetir é seguro? | Vira incidente? |
        |---|---|---|---|
        | `pending` | Criado, cobrança ainda não tentada | — | não |
        | `paid` | Cobrança aprovada | — | não |
        | `declined` | O gateway respondeu "não". Erro **esperado** | repetir não muda o resultado | não |
        | `failed` | Não cobramos, e temos **prova** disso | sim | sim (`warning`) |
        | `unknown` | A cobrança saiu e **não sabemos** o resultado | **não** | sim (`critical`) |

        `unknown` entrou na Fase 2 e é o estado que quase nenhum sistema
        modela. Ele existe nos dados, e não só na resposta HTTP, por dois
        motivos: guardá-lo como `failed` faz alguém escrever um dia
        "reprocessa todos os failed" e cobrar de novo quem já foi cobrado;
        guardá-lo como `pending` o torna indistinguível de um pedido que nem
        tentou. É a fila de reconciliação que a Fase 3 vai consumir.

    PaymentEvent:
      type: object
      required: [event_id, type, order_id, payment_id, status]
      properties:
        event_id:
          type: string
          maxLength: 64
          description: |
            Identifica o **evento**, não a entrega. Reenvios repetem o mesmo
            valor — é nele que a Fase 3 põe um `UNIQUE`.
          examples: [evt_e2b497b5bb0c42e0]
        type:
          type: string
          maxLength: 64
          enum: [payment.succeeded, payment.failed]
        order_id:
          type: string
          format: uuid
        payment_id:
          type: string
          maxLength: 64
          examples: [pay_ede9d00436c4ea2c]
        status:
          type: string
          maxLength: 20
          enum: [approved, declined]
        occurred_at:
          type: [string, 'null']
          format: date-time
          description: |
            Quando o evento aconteceu **no gateway**. É por este campo que se
            ordena, não pela hora de chegada: a Fase 3 precisa disso para não
            deixar um evento velho sobrescrever um novo.

    ProblemDetails:
      type: object
      description: |
        RFC 9457 — "Problem Details for HTTP APIs". É o formato de **toda**
        resposta de erro desta API desde a Fase 2, sempre com
        `Content-Type: application/problem+json`.

        O content-type é metade da especificação: o cliente sabe que recebeu
        erro estruturado olhando só o header, sem inspecionar o corpo.

        A RFC permite **membros de extensão** (§3.2), e é por essa porta que
        entram o `request_id` (em todos) e campos específicos de cada tipo,
        como `order_id`, `decline_code` e `errors`.
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI que identifica o **tipo** do problema. É a chave que o cliente
            usa no `if`, e é estável: mudar o `type` é quebra de contrato.
            `about:blank` significa "não há nada além do que o status HTTP já
            diz".
          examples: ['/problems/gateway-unavailable']
        title:
          type: string
          description: |
            Resumo legível do tipo — do TIPO, não da ocorrência: não muda de
            requisição para requisição.
          examples: ['Gateway de pagamento indisponível']
        status:
          type: integer
          description: |
            O mesmo status da resposta HTTP, duplicado de propósito: o corpo
            pode ser guardado, logado ou encaminhado longe do response.
          examples: [503]
        detail:
          type: string
          description: |
            O que aconteceu nesta ocorrência. Para humano ler, não para código
            comparar — use o `type` no `if`.
        instance:
          type: string
          format: uri-reference
          description: |
            URI da ocorrência. Nos erros de pedido, aponta para o próprio
            pedido: é o que torna o `504` acionável.
          examples: ['/orders/01a1ef36-69f0-7128-819b-2f9d7a625b18']
        request_id:
          type: string
          description: |
            Membro de extensão presente em **todo** problema, com o mesmo
            valor do header `X-Request-Id`. Está no corpo porque corpo de erro
            é o que um cliente guarda em log ou cola num chamado — e é com ele
            que se acha a requisição inteira, inclusive o job assíncrono.
          examples: ['01KA7Z4R8P3Q1T6V9W2X5Y8Z0B']
      additionalProperties: true

    ValidationProblem:
      description: |
        O problema de validação: um `ProblemDetails` com o membro de extensão
        `errors`.

        Seguir a RFC não pode custar a informação que o cliente usa, então a
        lista de campos do Laravel foi mantida — só mudou de lugar.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Um array de mensagens por campo inválido.
              additionalProperties:
                type: array
                items:
                  type: string

  responses:
    IdempotencyKeyAusente:
      description: |
        O header `Idempotency-Key` não foi enviado. Produzido pelo middleware
        `App\Http\Middleware\Idempotency`, antes de qualquer coisa acontecer.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problems/missing-idempotency-key
            title: Idempotency-Key obrigatório
            status: 400
            detail: >-
              Esta rota exige o header Idempotency-Key para que você possa
              repetir a requisição com segurança depois de um timeout.
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B

    ErroDeValidacao:
      description: |
        Payload inválido. Erro **esperado**: responde ao cliente e não gera
        alerta nem acorda ninguém (`dontReport` em `bootstrap/app.php`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: /problems/validation
            title: Dados inválidos
            status: 422
            detail: Um ou mais campos não passaram na validação. Veja `errors`.
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B
            errors:
              amount_cents: ['The amount cents field must be at least 1.']
              currency: ['The selected currency is invalid.']
              customer_email: ['The customer email field is required.']

    PagamentoRecusado:
      description: |
        O gateway recusou a cobrança. **O pedido foi criado** e fica
        consultável, com `status: declined` e o motivo em `decline_reason`; o
        `instance` do problema aponta para ele.

        Erro **esperado**: repetir não muda o resultado, e isto não é
        incidente — não vai para o log de erro nem conta na taxa de erro. Use
        `decline_code` para decidir o que dizer ao usuário final.

        Reproduza: `GATEWAY_DECLINE_RATE=1` no `.env` da raiz e
        `docker compose up -d gateway`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problems/payment-declined
            title: Pagamento recusado
            status: 402
            detail: >-
              O gateway recusou a cobrança. O pedido foi criado e está com
              status `declined`. Repetir a mesma requisição não muda o
              resultado: use outro meio de pagamento.
            instance: /orders/01a1ef36-7a10-71c2-9f3e-1b8c0d4e5f60
            order_id: 01a1ef36-7a10-71c2-9f3e-1b8c0d4e5f60
            decline_code: insufficient_funds
            payment_id: pay_2b3ce738b3ac92d4
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B

    GatewayIndisponivel:
      description: |
        Não conseguimos falar com o gateway, e **a cobrança não aconteceu** —
        conexão recusada, ou um `503` em que o próprio gateway diz que não
        processou nada. O pedido fica com status `failed`.

        Já retentamos (até 3 vezes, com backoff) antes de devolver isto.
        Repetir a requisição é **seguro**: respeite o `Retry-After`.

        Reproduza: `./scripts/gateway-down.sh 120 down` (ou o modo
        `unavailable`, que é o `503`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problems/gateway-unavailable
            title: Gateway de pagamento indisponível
            status: 503
            detail: >-
              Não conseguimos falar com o gateway de pagamento e a cobrança
              não foi feita. O pedido ficou com status `failed`. Pode repetir
              a requisição com a MESMA Idempotency-Key.
            instance: /orders/01a1ef36-8b20-7244-b0e1-3c9d0e5f6a71
            order_id: 01a1ef36-8b20-7244-b0e1-3c9d0e5f6a71
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B

    PagamentoSemConfirmacao:
      description: |
        A cobrança **saiu** e não obtivemos resposta conclusiva: timeout de
        leitura, ou um `500` do gateway (que pode ter cobrado antes de
        explodir). O pedido fica com status `unknown`.

        **Não repita.** Esta é a única resposta desta API que não vem com
        `Retry-After`, e a ausência é intencional: enquanto o gateway não
        honrar a `Idempotency-Key` (Fase 3), repetir pode cobrar duas vezes.
        Consulte o pedido — o `instance` tem a URI.

        Por isso também não houve retry do nosso lado: só retentamos quando há
        prova de que a cobrança não foi processada.

        Reproduza: `./scripts/gateway-down.sh 30 timeout` (ou o modo `fail`,
        que é o `500`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problems/payment-unconfirmed
            title: Pagamento sem confirmação
            status: 504
            detail: >-
              Enviamos a cobrança e não obtivemos uma resposta conclusiva do
              gateway. NÃO sabemos se o pagamento foi feito; o pedido ficou
              com status `unknown`. Consulte o pedido antes de tentar pagar de
              novo.
            instance: /orders/01a1ef36-9c30-7355-c1f2-4d0e1f607b82
            order_id: 01a1ef36-9c30-7355-c1f2-4d0e1f607b82
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B

    ErroInterno:
      description: |
        Erro **inesperado** nosso: bug, banco fora, contrato quebrado com o
        gateway. É reportado com stack trace **no log**, e o cliente recebe
        só isto.

        O que mudou na Fase 2: antes, com `APP_DEBUG=true`, o corpo trazia
        `exception`, `file`, `line` e o stack trace inteiro. Agora o trace
        nunca sai; em debug sai apenas o membro de extensão `debug`, com três
        campos, e em produção (`APP_DEBUG=false`) nem isso.

        O que o cliente tem para agir é o `request_id`: com ele, o log da
        requisição inteira — nginx, aplicação, gateway e job — é recuperável
        com `./scripts/follow-request.sh`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problems/internal
            title: Erro interno
            status: 500
            detail: >-
              Erro inesperado do nosso lado. Nada foi perdido do seu pedido se
              ele já existe; informe o `request_id` para investigarmos.
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B

    NaoEncontrado:
      description: |
        Recurso inexistente.

        O `type` é `about:blank` de propósito: o status já diz tudo o que há
        para dizer (RFC 9457 §4.2.1). E não há `detail`, porque a mensagem
        padrão do Eloquent vazaria o nome do model.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestIdResponse'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Não encontrado
            status: 404
            request_id: 01KA7Z4R8P3Q1T6V9W2X5Y8Z0B
