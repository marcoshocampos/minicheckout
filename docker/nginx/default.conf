# ---------------------------------------------------------------------------
# Este arquivo é incluído no contexto http{}, então `map` e `log_format` valem aqui.
# ---------------------------------------------------------------------------

# Se o cliente mandou X-Request-Id, respeita. Se não, usa o id que o nginx gera.
# Assim TODA requisição tem um id, mesmo antes do middleware da Fase 1 existir.
map $http_x_request_id $mc_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Log de acesso em JSON desde já: na Fase 1 você vai cruzar este request_id
# com o log da aplicação e com o log do job.
log_format mc_json escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"source":"nginx",'
    '"request_id":"$mc_request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"duration_ms":$request_time,'
    '"upstream_ms":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,'
    '"user_agent":"$http_user_agent"'
  '}';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    access_log /dev/stdout mc_json;
    error_log  /dev/stderr warn;

    client_max_body_size 10m;

    # Devolve o id no response: é o que permite o cliente te mandar
    # "deu erro, o id é X" e você achar a requisição no log.
    add_header X-Request-Id $mc_request_id always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Repassa o id resolvido (do cliente ou gerado) para o PHP.
        fastcgi_param HTTP_X_REQUEST_ID $mc_request_id;
        # 60s: longo o bastante para você VER o gateway pendurado na Fase 2
        # sem o nginx cortar antes e esconder o problema.
        fastcgi_read_timeout 60s;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
